name: Build title-specific Android APK

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: "Lowercase APK/project name (letters, numbers and underscores)"
        required: true
        type: string
        default: bully
      iso_url:
        description: "HTTPS direct-download URL for an Xbox 360 ISO you are legally entitled to use"
        required: true
        type: string
      iso_sha256:
        description: "Optional SHA-256 of the ISO (64 hexadecimal characters)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: title-apk-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          GAME_NAME: ${{ inputs.game_name }}
          ISO_URL: ${{ inputs.iso_url }}
          ISO_SHA256: ${{ inputs.iso_sha256 }}
        run: |
          python - <<'PY'
          import os, re
          from urllib.parse import urlparse
          name = os.environ["GAME_NAME"].strip()
          if not re.fullmatch(r"[a-z][a-z0-9_]{0,63}", name):
              raise SystemExit("game_name must start with a lowercase letter and contain only lowercase letters, digits or underscores (max 64 chars).")
          url = urlparse(os.environ["ISO_URL"].strip())
          if url.scheme != "https" or not url.hostname:
              raise SystemExit("iso_url must be a direct HTTPS URL.")
          digest = os.environ["ISO_SHA256"].strip().lower()
          if digest and not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("iso_sha256 must be empty or exactly 64 hexadecimal characters.")
          print(f"Project name: {name}")
          print("Input URL validated as HTTPS; the URL itself is not printed.")
          PY

      - name: Download ISO
        env:
          ISO_URL: ${{ inputs.iso_url }}
        run: |
          mkdir -p dist
          set +e
          http_code="$(curl --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 30 --retry 2 --max-filesize 25000000000 \
            --output dist/input.iso --write-out '%{http_code}' "$ISO_URL")"
          curl_status=$?
          set -e
          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            rm -f dist/input.iso
            if [ "$http_code" = "403" ]; then
              echo "::error::The server returned HTTP 403. This URL is not accessible to GitHub Actions; it may be a webpage rather than a direct file download. Use a direct HTTPS link to a game image you are authorized to use. This workflow does not bypass server access controls."
            elif [ "$http_code" = "404" ]; then
              echo "::error::The server returned HTTP 404. Check that the direct download URL still exists."
            elif [ "$curl_status" -eq 63 ]; then
              echo "::error::The download exceeded the 25 GB limit."
            else
              echo "::error::The ISO download failed (curl exit $curl_status, HTTP $http_code). Check the direct HTTPS URL and whether the host permits automated downloads."
            fi
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path("dist/input.iso")
          size = p.stat().st_size
          if size < 1024 * 1024:
              raise SystemExit(f"Downloaded file is too small to be a game ISO ({size} bytes). The URL may point to an HTML page.")
          if size > 25_000_000_000:
              raise SystemExit("ISO exceeds the 25 GB safety limit.")
          with p.open("rb") as f:
              head = f.read(4096).lstrip().lower()
          if head.startswith((b"<!doctype html", b"<html", b"<?xml")):
              p.unlink(missing_ok=True)
              raise SystemExit("The server returned a web page instead of an ISO. Enter a direct download URL, not a page URL.")
          print(f"Downloaded file size: {size:,} bytes; XDVDFS validation follows in the next step.")
          PY

      - name: Verify optional ISO SHA-256
        env:
          EXPECTED_SHA256: ${{ inputs.iso_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          expected = os.environ["EXPECTED_SHA256"].strip().lower()
          if not expected:
              print("No expected SHA-256 supplied; skipping digest comparison.")
          else:
              digest = hashlib.sha256()
              with Path("dist/input.iso").open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      digest.update(chunk)
              actual = digest.hexdigest()
              if actual != expected:
                  raise SystemExit(f"ISO SHA-256 mismatch: expected {expected}, got {actual}")
              print("ISO SHA-256 verified.")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'

      - name: Install host compiler and runtime dependencies
        run: |
          wget -q https://apt.llvm.org/llvm.sh -O /tmp/llvm-xbo.sh
          sudo bash /tmp/llvm-xbo.sh 20
          sudo apt-get install -y clang-20 lld-20 libgtk-3-dev libvulkan-dev ninja-build \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libwayland-dev libpulse-dev \
            libasound2-dev libpipewire-0.3-dev glslc glslang-tools

      - uses: actions/cache/restore@v4
        id: android-cache
        with:
          path: ~/.cache/Xbox360Recomp/android
          key: android-runtime-8dd8b369-clang20-ndk27c-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            android-runtime-8dd8b369-clang20-ndk27c-${{ runner.os }}-

      - name: Install and verify desktop SDK used for project preparation
        run: python xbo360.py install-sdk --sdk sdk

      - name: Inspect ISO and confirm an XEX is present
        run: |
          python - <<'PY'
          import json
          from iso_import import inspect_iso
          info = inspect_iso("dist/input.iso")
          print(json.dumps(info, indent=2))
          if not info.get("executables"):
              raise SystemExit("No .xex executable was found in this XDVDFS image.")
          PY

      - name: Import ISO and prepare title project
        env:
          GAME_NAME: ${{ inputs.game_name }}
        run: |
          python xbo360.py prepare dist/input.iso \
            --project "dist/android-title" --name "$GAME_NAME" --sdk sdk

      - name: Cross-compile native ARM64 APK
        env:
          GAME_NAME: ${{ inputs.game_name }}
        run: |
          python xbo360.py android --project dist/android-title --runtime --jobs 3 \
            --android-sdk "$ANDROID_HOME" \
            --ndk "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Upload title APK (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-Android-APK
          path: |
            dist/android-title/android-export/*.apk
            dist/android-title/android-export/*.log
            dist/android-title/android-export/export.json
            dist/android-title/build.log
            dist/android-title/xbo360-project.json
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/cache/save@v4
        if: always() && steps.android-cache.outputs.cache-primary-key != ''
        with:
          path: ~/.cache/Xbox360Recomp/android
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
